<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>WAND RAIDERS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<script src="jingle.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Press Start 2P", monospace; color: #ff7a18; }
  #wrap { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #3a1020 0%, #12030a 62%, #050002 100%); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #scan { pointer-events: none; position: fixed; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%); mix-blend-mode: multiply; }
  #vignette { pointer-events: none; position: fixed; inset: 0; box-shadow: inset 0 0 120px 30px rgba(0,0,0,0.75); }
  #hudHint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 9px; color: rgba(255,122,24,0.7); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="scan"></div>
<div id="vignette"></div>
<div id="hudHint">DRAG TO MOVE  ·  TAP TO CAST  ·  ADD TO HOME SCREEN</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hudHint");
  let W = 0, H = 0, SCALE = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SCALE = Math.max(0.7, Math.min(W / 390, H / 700));
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  resize();
  let actx = null, master = null, muted = false;
  function playJingleWav() {
    if (muted || !window.WR_JINGLE) return;
    if (!window._jing) {
      window._jing = new Audio("data:audio/wav;base64," + window.WR_JINGLE);
      window._jing.setAttribute("playsinline", "");
      window._jing.volume = 1;
    }
    try { window._jing.pause(); window._jing.currentTime = 0; } catch (e) {}
    const p = window._jing.play();
    if (p && p.catch) p.catch(() => {});
  }
  function ensureAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC(); master = actx.createGain(); master.gain.value = 0.38; master.connect(actx.destination);
  }
  function beep(freq, dur, type = "square", vol = 0.6, slide = 0) {
    if (!actx || muted) return;
    if (actx.state !== "running") actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur = 0.18, vol = 0.35) {
    if (!actx || muted) return;
    const t = actx.currentTime, n = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = actx.createBufferSource(); s.buffer = n;
    const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400;
    const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function midiNote(freq, t0, dur, type, vol) {
    if (!actx || muted) return;
    if (actx.state !== "running") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(40, freq), t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.04);
  }
  function playJingle() {
    if (!actx || muted) return;
    const t = actx.currentTime + 0.05, b = 0.15;
    const mel = [392,466,523,466,392,349,311,349,392,392,466,523,622,523,466,392];
    const bass = [196,196,175,175,156,156,175,175,196,196,233,262,196,175,156,131];
    for (let i = 0; i < mel.length; i++) {
      midiNote(mel[i], t + i * b, b * 0.92, "square", 0.32);
      midiNote(bass[i], t + i * b, b * 0.95, "triangle", 0.24);
    }
  }
  function playSting() {
    if (!actx || muted) return;
    const t = actx.currentTime + 0.01;
    midiNote(311, t, 0.12, "square", 0.28);
    midiNote(392, t + 0.10, 0.12, "square", 0.28);
    midiNote(466, t + 0.20, 0.18, "square", 0.30);
  }
  function playGameOverJingle() {
    if (!actx || muted) return;
    const t = actx.currentTime + 0.02, b = 0.18;
    const notes = [523,466,392,349,311,262,220,196];
    for (let i = 0; i < notes.length; i++) midiNote(notes[i], t + i * b, b * 1.05, "square", 0.28);
  }
  function sfxLaser() { beep(980, 0.09, "square", 0.26, -420); beep(1320, 0.05, "triangle", 0.12); }
  function sfxEnemyShot() { beep(180, 0.14, "sawtooth", 0.18, -70); }
  function sfxHit() { beep(320, 0.07, "square", 0.25, 200); noiseBurst(0.08, 0.15); }
  function sfxBoom() { beep(90, 0.28, "sawtooth", 0.4, -50); noiseBurst(0.28, 0.4); }
  function sfxPlayerHit() { beep(140, 0.35, "square", 0.45, -90); noiseBurst(0.3, 0.45); }
  function sfxCoin() { beep(784, 0.08, "square", 0.3); setTimeout(() => beep(1046, 0.14, "square", 0.3), 90); }
  function sfxPower() { beep(523, 0.08, "square", 0.25); setTimeout(() => beep(784, 0.08, "square", 0.25), 70); setTimeout(() => beep(1046, 0.16, "square", 0.3), 140); }
  function sfxWave() { beep(196, 0.1, "square", 0.2); setTimeout(() => beep(262, 0.1, "square", 0.2), 80); setTimeout(() => beep(330, 0.18, "square", 0.25), 160); }
  const STATE = { TITLE: 0, PLAY: 1, WAVE: 2, OVER: 3 };
  let state = STATE.TITLE, score = 0, high = 0, lives = 3, wave = 1, combo = 0;
  try { high = parseInt(localStorage.getItem("nr_high") || "0", 10) || 0; } catch (e) {}
  let shake = 0, flash = 0, invuln = 0, fireCD = 0, stars = [], bats = [];
  let player, bullets, eBullets, enemies, particles, powerups, ufo;
  let enemyDir = 1, formOX = 0, diveTimer = 0, nextCol = 0, waveCols = 5;
  let titleFlicker = 0, waveMsg = "", waveTimer = 0, lastT = 0;
  function resetStars() {
    stars = [];
    for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3, v: Math.random() * 0.45 + 0.1, c: Math.random() < 0.25 ? "#ff7a18" : Math.random() < 0.45 ? "#9b5cff" : "#fff4c2" });
    bats = [];
    for (let i = 0; i < 6; i++) bats.push({ x: Math.random() * W, y: 40 + Math.random() * 160, vx: 0.6 + Math.random(), phase: Math.random() * 6 });
  }
  function makePlayer() {
    const pw = 30 * SCALE, ph = 28 * SCALE;
    player = { x: W / 2 - pw / 2, y: H - 86 * SCALE, w: pw, h: ph, rapid: 0, shield: 0 };
  }
  function spawnWave(n) {
    enemies = [];
    const cols = Math.min(8, 5 + Math.floor(n / 2));
    const rows = Math.min(5, 3 + Math.floor((n - 1) / 2));
    const gapX = Math.min(46 * SCALE, (W - 80 * SCALE) / cols);
    const gapY = 38 * SCALE;
    const startX = (W - (cols - 1) * gapX - 28 * SCALE) / 2;
    const startY = 78 * SCALE;
    const types = ["pumpkin", "ghost", "witch"];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const kind = types[Math.min(types.length - 1, Math.floor(r / Math.max(1, Math.floor(rows / 3))))];
        const hx = startX + c * gapX, hy = startY + r * gapY;
        enemies.push({ x: hx, y: hy, homeX: hx, homeY: hy, w: kind === "witch" ? 30 * SCALE : 26 * SCALE, h: kind === "witch" ? 26 * SCALE : 22 * SCALE, kind, hp: kind === "witch" ? 2 : 1, phase: Math.random() * Math.PI * 2, pts: kind === "witch" ? 40 : kind === "ghost" ? 20 : 10, col: c, mode: "form", diveDelay: 0 });
      }
    }
    enemyDir = 1; formOX = 0; nextCol = 0; waveCols = cols; diveTimer = 80;
    eBullets = []; bullets = []; if (!powerups) powerups = []; ufo = null; sfxWave();
  }
  function startGame() {
    ensureAudio();
    if (actx && actx.state === "suspended") actx.resume();
    playJingleWav();
    sfxCoin(); playJingle();
    score = 0; lives = 3; wave = 1; combo = 0; bullets = []; eBullets = []; particles = []; powerups = [];
    makePlayer(); invuln = 80; fireCD = 0; state = STATE.WAVE; waveMsg = "WAVE 01"; waveTimer = 80; spawnWave(1); hint.style.opacity = "0";
  }
  function saveHigh() { if (score > high) { high = score; try { localStorage.setItem("nr_high", String(high)); } catch (e) {} } }
  function boom(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 3.2 + 0.6;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 28 + Math.random() * 18, max: 40, c: color, sz: Math.random() * 3 + 1 });
    }
  }
  function spawnUfo() {
    if (ufo || Math.random() > 0.004 || state !== STATE.PLAY) return;
    ufo = { x: -46, y: 48 * SCALE, w: 40 * SCALE, h: 16 * SCALE, vx: 1.6 + Math.random(), pts: 50 + Math.floor(Math.random() * 4) * 50 };
  }
  function maybePower(x, y) {
    if (Math.random() > 0.18) return;
    const kinds = ["rapid", "shield", "life"];
    powerups.push({ x, y, w: 16 * SCALE, h: 16 * SCALE, kind: kinds[Math.floor(Math.random() * (lives < 3 ? 3 : 2))], vy: 1.15 });
  }
  let pointerX = null, pointerDown = false;
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    pointerX = e.clientX; pointerDown = true;
    ensureAudio();
    if (actx && actx.state === "suspended") actx.resume();
    if (state === STATE.TITLE || state === STATE.OVER) startGame();
    else if (state === STATE.PLAY) shoot(true);
  }, { passive: false });
  canvas.addEventListener("pointermove", (e) => { e.preventDefault(); if (e.buttons || e.pointerType === "touch") { pointerX = e.clientX; pointerDown = true; } }, { passive: false });
  canvas.addEventListener("pointerup", () => { pointerDown = false; });
  canvas.addEventListener("pointercancel", () => { pointerDown = false; });
  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyM") muted = !muted;
    if (e.code === "Space" || e.code === "Enter") {
      ensureAudio();
      if (actx && actx.state === "suspended") actx.resume();
      if (state === STATE.TITLE || state === STATE.OVER) startGame(); else shoot(true);
    }
  });
  function shoot(fromTap) {
    if (state !== STATE.PLAY || !player) return;
    const rate = player.rapid > 0 ? 8 : 16;
    if (fireCD > 0 && !fromTap) return;
    if (fromTap && fireCD > rate * 0.4) return;
    const n = player.rapid > 0 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const ox = n === 2 ? (i === 0 ? -6 : 6) * SCALE : 0;
      bullets.push({ x: player.x + player.w / 2 - 2 + ox, y: player.y - 8, w: 3 * SCALE, h: 11 * SCALE, vy: -9.5 });
    }
    fireCD = rate; sfxLaser();
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function update() {
    titleFlicker++;
    for (const s of stars) { s.y += s.v * (state === STATE.PLAY ? 1.2 : 0.6); if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
    for (const b of bats) { b.x += b.vx; b.phase += 0.18; if (b.x > W + 20) { b.x = -20; b.y = 30 + Math.random() * 180; } }
    if (shake > 0) shake *= 0.86; if (flash > 0) flash--; if (invuln > 0) invuln--; if (fireCD > 0) fireCD--;
    if (state === STATE.WAVE) { waveTimer--; if (waveTimer <= 0) state = STATE.PLAY; return; }
    if (state !== STATE.PLAY) return;
    if (pointerDown && pointerX != null) player.x += (pointerX - player.w / 2 - player.x) * 0.28;
    player.x = Math.max(8, Math.min(W - player.w - 8, player.x));
    if (player.rapid > 0) player.rapid--; if (player.shield > 0) player.shield--; if (pointerDown) shoot(false);
    bullets = bullets.filter(b => { b.y += b.vy; return b.y + b.h > -10; });
    eBullets = eBullets.filter(b => { b.y += b.vy; return b.y < H + 10; });
    for (const e of enemies) e.phase += 0.08;
    if (enemies.length) {
      formOX += enemyDir * (0.55 + wave * 0.04);
      if (formOX > 30 * SCALE || formOX < -30 * SCALE) enemyDir *= -1;
      const busy = enemies.some(e => e.mode !== "form");
      if (!busy) diveTimer--;
      if (!busy && diveTimer <= 0) {
        let launched = false;
        for (let t = 0; t < waveCols && !launched; t++) {
          const col = nextCol % waveCols; nextCol++;
          const group = enemies.filter(e => e.col === col && e.mode === "form").sort((a, b) => b.homeY - a.homeY);
          if (!group.length) continue;
          group.forEach((e, i) => { e.mode = "dive"; e.diveDelay = i * 12; });
          playSting(); launched = true;
        }
        diveTimer = Math.max(48, 100 - wave * 8);
      }
      for (const e of enemies) {
        if (e.mode === "form") { e.x = e.homeX + formOX; e.y = e.homeY; }
        else if (e.mode === "dive") {
          if (e.diveDelay > 0) { e.diveDelay--; e.x = e.homeX + formOX; e.y = e.homeY; }
          else {
            e.y += 3.1 + wave * 0.18;
            e.x += ((player.x + player.w / 2) - (e.x + e.w / 2)) * 0.035;
            if (e.y > H + 24) { e.mode = "return"; e.y = -36; e.x = e.homeX + formOX; }
          }
        } else {
          const hx = e.homeX + formOX, hy = e.homeY;
          e.x += (hx - e.x) * 0.13; e.y += (hy - e.y) * 0.13;
          if (Math.abs(e.x - hx) < 2.5 && Math.abs(e.y - hy) < 2.5) { e.mode = "form"; e.x = hx; e.y = hy; }
        }
      }
      if (Math.random() < 0.012 + wave * 0.003) {
        const divers = enemies.filter(e => e.mode === "dive" && e.diveDelay <= 0);
        const pool = divers.length ? divers : enemies;
        const shooter = pool[Math.floor(Math.random() * pool.length)];
        eBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 3 * SCALE, h: 9 * SCALE, vy: 3.4 + wave * 0.15 });
        sfxEnemyShot();
      }
    }
    spawnUfo(); if (ufo) { ufo.x += ufo.vx; if (ufo.x > W + 40) ufo = null; }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; let used = false;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j]; if (!hit(b, e)) continue;
        e.hp--; used = true; sfxHit();
        const col = e.kind === "witch" ? "#9b5cff" : e.kind === "ghost" ? "#f4f0e1" : "#ff7a18";
        boom(e.x + e.w / 2, e.y + e.h / 2, col, 8);
        if (e.hp <= 0) {
          combo++; const add = e.pts * Math.min(8, 1 + Math.floor(combo / 4)); score += add;
          spawnFloat(e.x, e.y, "+" + add); maybePower(e.x + e.w / 2, e.y); enemies.splice(j, 1); shake = Math.min(10, shake + 3);
        }
        break;
      }
      if (!used && ufo && hit(b, ufo)) {
        score += ufo.pts; spawnFloat(ufo.x, ufo.y, "+" + ufo.pts + " BROOM");
        boom(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, "#ffe14a", 22); sfxBoom(); maybePower(ufo.x + ufo.w / 2, ufo.y);
        ufo = null; used = true; shake = 8;
      }
      if (used) bullets.splice(i, 1);
    }
    if (invuln <= 0) {
      let ram = false;
      for (const e of enemies) { if (e.mode === "dive" && e.diveDelay <= 0 && hit(e, player)) { ram = true; break; } }
      for (let i = eBullets.length - 1; i >= 0; i--) { if (hit(eBullets[i], player)) { eBullets.splice(i, 1); ram = true; break; } }
      if (ram) {
        if (player.shield > 0) { player.shield = 0; boom(player.x + player.w / 2, player.y, "#9b5cff", 12); sfxHit(); invuln = 40; }
        else {
          lives--; combo = 0; invuln = 90; flash = 10; shake = 14; sfxPlayerHit();
          boom(player.x + player.w / 2, player.y + player.h / 2, "#ff7a18", 24);
          if (lives <= 0) gameOver();
        }
      }
    }
    powerups = powerups.filter(p => {
      p.y += p.vy;
      if (hit(p, player)) {
        if (p.kind === "rapid") player.rapid = 420;
        if (p.kind === "shield") player.shield = 480;
        if (p.kind === "life" && lives < 5) lives++;
        sfxPower(); spawnFloat(p.x, p.y, p.kind === "rapid" ? "SPELLS" : p.kind === "shield" ? "CHARM" : "1UP"); return false;
      }
      return p.y < H + 20;
    });
    particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--; return p.life > 0; });
    if (!enemies.length && state === STATE.PLAY) { wave++; combo = 0; state = STATE.WAVE; waveMsg = "WAVE " + String(wave).padStart(2, "0"); waveTimer = 70; spawnWave(wave); }
  }
  let floats = [];
  function spawnFloat(x, y, txt) { floats.push({ x, y, text: txt, life: 50 }); }
  function gameOver() { state = STATE.OVER; saveHigh(); sfxBoom(); playGameOverJingle(); hint.style.opacity = "1"; }
  function pxFill(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  function text(str, x, y, size, color, align = "center") {
    ctx.font = size + "px 'Press Start 2P', monospace"; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function glowText(str, x, y, size, color) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 12; text(str, x, y, size, color); ctx.restore(); text(str, x, y, size, color); }
  function drawMoon() {
    const mx = W - 54 * SCALE, my = 58 * SCALE, r = 22 * SCALE;
    ctx.fillStyle = "#fff4c2"; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#12030a"; ctx.beginPath(); ctx.arc(mx + 8 * SCALE, my - 4 * SCALE, r * 0.78, 0, Math.PI * 2); ctx.fill();
  }
  function drawJackBG() {
    const size = Math.min(W, H) * 0.868, cx = W * 0.5, cy = H * 0.58;
    const flicker = 0.16 + 0.04 * Math.sin(titleFlicker / 18);
    ctx.save();
    ctx.globalAlpha = flicker; ctx.fillStyle = "#c45a10";
    ctx.beginPath();
    ctx.ellipse(cx - size * 0.16, cy, size * 0.30, size * 0.36, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + size * 0.16, cy, size * 0.30, size * 0.36, 0, 0, Math.PI * 2);
    ctx.ellipse(cx, cy + size * 0.02, size * 0.38, size * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = flicker * 0.9; ctx.fillStyle = "#2f6b2a";
    ctx.fillRect(cx - size * 0.05, cy - size * 0.44, size * 0.10, size * 0.13);
    const glow = 0.28 + 0.08 * Math.sin(titleFlicker / 10);
    ctx.globalAlpha = glow; ctx.fillStyle = "#ffb347";
    ctx.beginPath(); ctx.moveTo(cx - size * 0.20, cy - size * 0.04); ctx.lineTo(cx - size * 0.08, cy - size * 0.20); ctx.lineTo(cx - size * 0.02, cy - size * 0.02); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + size * 0.20, cy - size * 0.04); ctx.lineTo(cx + size * 0.08, cy - size * 0.20); ctx.lineTo(cx + size * 0.02, cy - size * 0.02); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, cy + size * 0.02); ctx.lineTo(cx + size * 0.06, cy + size * 0.12); ctx.lineTo(cx - size * 0.06, cy + size * 0.12); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.20, cy + size * 0.12); ctx.lineTo(cx - size * 0.12, cy + size * 0.08);
    ctx.lineTo(cx - size * 0.04, cy + size * 0.14); ctx.lineTo(cx, cy + size * 0.08);
    ctx.lineTo(cx + size * 0.04, cy + size * 0.14); ctx.lineTo(cx + size * 0.12, cy + size * 0.08);
    ctx.lineTo(cx + size * 0.20, cy + size * 0.12); ctx.lineTo(cx + size * 0.14, cy + size * 0.24);
    ctx.lineTo(cx + size * 0.06, cy + size * 0.18); ctx.lineTo(cx, cy + size * 0.26);
    ctx.lineTo(cx - size * 0.06, cy + size * 0.18); ctx.lineTo(cx - size * 0.14, cy + size * 0.24);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawBat(b) {
    const flap = Math.sin(b.phase) * 5;
    pxFill(b.x, b.y, 4, 3, "#1a0a10"); pxFill(b.x - 7, b.y + flap * 0.3, 7, 2, "#1a0a10"); pxFill(b.x + 4, b.y - flap * 0.3, 7, 2, "#1a0a10");
  }
  function drawWizard(x, y, w, h, t) {
    pxFill(x + w * 0.22, y + h * 0.42, w * 0.56, h * 0.52, "#1b1530");
    pxFill(x + w * 0.28, y + h * 0.48, w * 0.12, h * 0.42, "#7a1020");
    pxFill(x + w * 0.36, y + h * 0.18, w * 0.28, h * 0.28, "#e6b089");
    pxFill(x + w * 0.32, y + h * 0.12, w * 0.38, h * 0.12, "#2a1a12");
    pxFill(x + w * 0.38, y + h * 0.26, w * 0.08, h * 0.06, "#111");
    pxFill(x + w * 0.54, y + h * 0.26, w * 0.08, h * 0.06, "#111");
    pxFill(x + w * 0.44, y + h * 0.20, w * 0.05, h * 0.07, "#c1121f");
    pxFill(x + w * 0.62, y + h * 0.02, w * 0.07, h * 0.42, "#6b3a18");
    pxFill(x + w * 0.60, y - 2, w * 0.11, 4, "#ffe14a");
    if (Math.floor(t / 5) % 2 === 0) pxFill(x + w * 0.58, y - 8, 3, 3, "#fff4c2");
  }
  function drawEnemy(e, t) {
    const { x, y, w, h, kind, phase } = e, yy = y + Math.sin(phase + t / 10) * 2;
    if (kind === "pumpkin") {
      pxFill(x + w * 0.18, yy + h * 0.22, w * 0.64, h * 0.62, "#ff7a18");
      pxFill(x + w * 0.42, yy + h * 0.08, w * 0.16, h * 0.2, "#2f6b2a");
      pxFill(x + w * 0.28, yy + h * 0.38, w * 0.12, h * 0.14, "#1a0508");
      pxFill(x + w * 0.58, yy + h * 0.38, w * 0.12, h * 0.14, "#1a0508");
      pxFill(x + w * 0.36, yy + h * 0.58, w * 0.28, h * 0.1, "#1a0508");
    } else if (kind === "ghost") {
      pxFill(x + w * 0.18, yy + h * 0.12, w * 0.64, h * 0.62, "#f4f0e1");
      pxFill(x + w * 0.18, yy + h * 0.68, w * 0.18, h * 0.22, "#f4f0e1");
      pxFill(x + w * 0.42, yy + h * 0.72, w * 0.16, h * 0.2, "#f4f0e1");
      pxFill(x + w * 0.64, yy + h * 0.68, w * 0.18, h * 0.22, "#f4f0e1");
      pxFill(x + w * 0.30, yy + h * 0.28, w * 0.12, h * 0.16, "#1a0508");
      pxFill(x + w * 0.56, yy + h * 0.28, w * 0.12, h * 0.16, "#1a0508");
    } else {
      const flap = Math.sin(phase + t / 8) * (h * 0.06);
      pxFill(x, yy + h * 0.62 + flap * 0.2, w * 0.72, Math.max(2, h * 0.08), "#7a4a1c");
      pxFill(x + w * 0.68, yy + h * 0.48 + flap, w * 0.32, h * 0.36, "#d9a441");
      pxFill(x + w * 0.22, yy + h * 0.38, w * 0.42, h * 0.40, "#3b1760");
      pxFill(x + w * 0.10, yy + h * 0.42 + flap, w * 0.16, h * 0.28, "#24103a");
      pxFill(x + w * 0.30, yy + h * 0.22, w * 0.28, h * 0.22, "#6fbf4a");
      pxFill(x + w * 0.26, yy + h * 0.24, w * 0.08, h * 0.28, "#1a0a12");
      pxFill(x + w * 0.56, yy + h * 0.24, w * 0.10, h * 0.32, "#1a0a12");
      pxFill(x + w * 0.54, yy + h * 0.30, w * 0.10, h * 0.08, "#4e9a32");
      pxFill(x + w * 0.34, yy + h * 0.28, w * 0.07, h * 0.07, "#ffe14a");
      pxFill(x + w * 0.46, yy + h * 0.28, w * 0.07, h * 0.07, "#ffe14a");
      pxFill(x + w * 0.20, yy + h * 0.16, w * 0.48, h * 0.08, "#0a0408");
      pxFill(x + w * 0.34, yy, w * 0.20, h * 0.20, "#140814");
      pxFill(x + w * 0.38, yy - h * 0.08, w * 0.12, h * 0.12, "#140814");
      pxFill(x + w * 0.36, yy + h * 0.12, w * 0.16, h * 0.05, "#ffe14a");
      if (e.hp > 1) pxFill(x + w * 0.38, yy - h * 0.16, w * 0.22, 3, "#ffe14a");
    }
  }
  function drawBroom(u) {
    pxFill(u.x, u.y + u.h * 0.52, u.w * 0.62, 4, "#7a4a1c");
    pxFill(u.x + u.w * 0.58, u.y + u.h * 0.28, u.w * 0.42, u.h * 0.52, "#d9a441");
    pxFill(u.x + u.w * 0.26, u.y + u.h * 0.18, u.w * 0.24, u.h * 0.42, "#3b1760");
    pxFill(u.x + u.w * 0.30, u.y + u.h * 0.06, u.w * 0.16, u.h * 0.20, "#6fbf4a");
    pxFill(u.x + u.w * 0.28, u.y - 2, u.w * 0.22, u.h * 0.12, "#140814");
  }
  function drawTitle(t) {
    glowText("WAND", W / 2, H * 0.20, Math.max(22, 28 * SCALE), "#ff7a18");
    glowText("RAIDERS", W / 2, H * 0.20 + 42 * SCALE, Math.max(16, 22 * SCALE), "#9b5cff");
    text("HALLOWEEN  ARCADE", W / 2, H * 0.20 + 72 * SCALE, 8 * SCALE, "#ffe14a");
    const demo = [{ kind: "pumpkin", x: W / 2 - 96 * SCALE, y: H * 0.40 }, { kind: "ghost", x: W / 2 - 16 * SCALE, y: H * 0.40 }, { kind: "witch", x: W / 2 + 58 * SCALE, y: H * 0.39 }];
    demo.forEach((d, i) => drawEnemy({ ...d, w: d.kind === "witch" ? 34 * SCALE : 28 * SCALE, h: d.kind === "witch" ? 28 * SCALE : 22 * SCALE, phase: t / 8 + i, hp: 1 }, t));
    drawWizard(W / 2 - 18 * SCALE, H * 0.52, 36 * SCALE, 34 * SCALE, t);
    if (Math.floor(t / 28) % 2 === 0) glowText("TAP TO CAST", W / 2, H * 0.68, 11 * SCALE, "#ffe14a");
    text("HIGH  " + String(high).padStart(6, "0"), W / 2, H * 0.76, 10 * SCALE, "#fff");
  }
  function drawHUD() {
    text("1UP", 16 * SCALE, 18 * SCALE, 8 * SCALE, "#ff7a18", "left");
    text(String(score).padStart(6, "0"), 16 * SCALE, 34 * SCALE, 10 * SCALE, "#fff", "left");
    text("HI", W / 2, 18 * SCALE, 8 * SCALE, "#ffe14a");
    text(String(Math.max(high, score)).padStart(6, "0"), W / 2, 34 * SCALE, 10 * SCALE, "#fff");
    text("WAVE " + String(wave).padStart(2, "0"), W - 16 * SCALE, 18 * SCALE, 8 * SCALE, "#9b5cff", "right");
    for (let i = 0; i < lives; i++) drawWizard(W - 30 * SCALE - i * 26 * SCALE, 26 * SCALE, 16 * SCALE, 16 * SCALE, 0);
    if (player && player.rapid > 0) text("RAPID HEX", W / 2, H - 18 * SCALE, 8 * SCALE, "#ffe14a");
    if (player && player.shield > 0) {
      ctx.strokeStyle = "rgba(155,92,255,0.75)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w * 0.85, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawGameOver(t) {
    ctx.fillStyle = "rgba(18,3,10,0.6)"; ctx.fillRect(0, 0, W, H);
    glowText("GAME OVER", W / 2, H * 0.38, 20 * SCALE, "#ff7a18");
    text("SCORE  " + String(score).padStart(6, "0"), W / 2, H * 0.48, 12 * SCALE, "#fff");
    text("BEST   " + String(high).padStart(6, "0"), W / 2, H * 0.55, 12 * SCALE, "#ffe14a");
    if (Math.floor(t / 28) % 2 === 0) glowText("TAP TO CONTINUE", W / 2, H * 0.68, 11 * SCALE, "#9b5cff");
  }
  function frame(ts) {
    if (!lastT) lastT = ts; lastT = ts; update();
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.fillStyle = "#12030a"; ctx.fillRect(0, 0, W, H);
    drawMoon(); drawJackBG();
    for (const s of stars) { ctx.globalAlpha = 0.45 + s.s / 2; pxFill(s.x, s.y, s.s, s.s, s.c); }
    ctx.globalAlpha = 1; for (const b of bats) drawBat(b);
    if (state === STATE.TITLE) drawTitle(titleFlicker);
    else {
      if (ufo) drawBroom(ufo);
      for (const e of enemies) drawEnemy(e, titleFlicker);
      for (const b of bullets) pxFill(b.x, b.y, b.w, b.h, "#ffe14a");
      for (const b of eBullets) pxFill(b.x, b.y, b.w, b.h, "#7cff6b");
      for (const p of powerups) {
        const col = p.kind === "life" ? "#7cff6b" : p.kind === "shield" ? "#9b5cff" : "#ffe14a";
        pxFill(p.x, p.y, p.w, p.h, col);
        text(p.kind === "life" ? "1" : p.kind === "shield" ? "C" : "H", p.x + p.w / 2, p.y + p.h / 2, 8 * SCALE, "#12030a");
      }
      for (const p of particles) { ctx.globalAlpha = p.life / p.max; pxFill(p.x, p.y, p.sz, p.sz, p.c); }
      ctx.globalAlpha = 1;
      for (const f of floats) { f.y -= 0.6; f.life--; ctx.globalAlpha = Math.max(0, f.life / 50); text(f.text, f.x, f.y, 8 * SCALE, "#ffe14a"); }
      floats = floats.filter(f => f.life > 0); ctx.globalAlpha = 1;
      if (player && (invuln <= 0 || Math.floor(titleFlicker / 4) % 2 === 0)) drawWizard(player.x, player.y, player.w, player.h, titleFlicker);
      drawHUD();
      if (state === STATE.WAVE) { glowText(waveMsg, W / 2, H * 0.45, 18 * SCALE, "#ffe14a"); text("GET READY", W / 2, H * 0.45 + 32 * SCALE, 10 * SCALE, "#ff7a18"); }
      if (state === STATE.OVER) drawGameOver(titleFlicker);
    }
    if (flash > 0) { ctx.fillStyle = "rgba(255,122,24," + (flash / 18) + ")"; ctx.fillRect(0, 0, W, H); }
    ctx.restore(); requestAnimationFrame(frame);
  }
  resetStars(); makePlayer(); enemies = []; bullets = []; eBullets = []; particles = []; powerups = [];
  requestAnimationFrame(frame);
})();
</script>
</body>
