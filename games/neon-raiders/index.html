  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  }
  let floats = [];
  function spawnFloat(x, y, txt) { floats.push({ x, y, text: txt, life: 50 }); }

  function pxFill(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  }

  }
  function drawJackBG() {
