<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>NEON RAIDERS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #050012; --cyan: #00fff6; --mag: #ff2bd6; --yel: #ffe14a; --org: #ff6a00; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; font-family: "Press Start 2P", monospace;
    color: var(--cyan);
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #14002a 0%, #050012 70%, #000 100%);
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #scan {
    pointer-events: none;
    position: fixed; inset: 0;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #vignette {
    pointer-events: none;
    position: fixed; inset: 0;
    box-shadow: inset 0 0 120px 30px rgba(0,0,0,0.7);
  }
  #hudHint {
    position: fixed; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 9px; letter-spacing: 1px;
    color: rgba(0,255,246,0.55);
    text-shadow: 0 0 8px #00fff6;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<div id="scan"></div>
<div id="vignette"></div>
<div id="hudHint">DRAG TO MOVE  ·  TAP TO FIRE  ·  ADD TO HOME SCREEN</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hudHint");

  let W = 0, H = 0, SCALE = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SCALE = Math.max(0.7, Math.min(W / 390, H / 700));
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  resize();

  let actx = null, master = null, muted = false;
  function ensureAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.18;
    master.connect(actx.destination);
  }
  function beep(freq, dur, type = "square", vol = 0.6, slide = 0) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur = 0.18, vol = 0.35) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const n = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = actx.createBufferSource(); s.buffer = n;
    const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t);
  }
  function sfxLaser() { beep(880, 0.08, "square", 0.28, -500); }
  function sfxEnemyShot() { beep(220, 0.12, "sawtooth", 0.18, -80); }
  function sfxHit() { beep(320, 0.07, "square", 0.25, 200); noiseBurst(0.08, 0.15); }
  function sfxBoom() { beep(90, 0.28, "sawtooth", 0.4, -50); noiseBurst(0.28, 0.4); }
  function sfxPlayerHit() { beep(140, 0.35, "square", 0.45, -90); noiseBurst(0.3, 0.45); }
  function sfxCoin() { beep(784, 0.08, "square", 0.3); setTimeout(() => beep(1046, 0.14, "square", 0.3), 90); }
  function sfxPower() { beep(523, 0.08, "square", 0.25); setTimeout(() => beep(784, 0.08, "square", 0.25), 70); setTimeout(() => beep(1046, 0.16, "square", 0.3), 140); }
  function sfxWave() { beep(196, 0.1, "square", 0.2); setTimeout(() => beep(262, 0.1, "square", 0.2), 80); setTimeout(() => beep(330, 0.18, "square", 0.25), 160); }

  const STATE = { TITLE: 0, PLAY: 1, WAVE: 2, OVER: 3 };
  let state = STATE.TITLE;
  let score = 0, high = 0, lives = 3, wave = 1, combo = 0;
  try { high = parseInt(localStorage.getItem("nr_high") || "0", 10) || 0; } catch(e) {}
  let shake = 0, flash = 0, invuln = 0, fireCD = 0;
  let stars = [];
  let player, bullets, eBullets, enemies, particles, powerups, ufo;
  let enemyDir = 1, enemySpeed = 0.4, dropPending = false;
  let titleFlicker = 0, waveMsg = "", waveTimer = 0;
  let lastT = 0;

  function resetStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.6 + 0.3,
        v: Math.random() * 0.6 + 0.15,
        c: Math.random() < 0.2 ? "#ff2bd6" : Math.random() < 0.4 ? "#00fff6" : "#ffffff"
      });
    }
  }

  function makePlayer() {
    const pw = 28 * SCALE, ph = 22 * SCALE;
    player = { x: W / 2 - pw / 2, y: H - 78 * SCALE, w: pw, h: ph, rapid: 0, shield: 0 };
  }

  function spawnWave(n) {
    enemies = [];
    const cols = Math.min(8, 5 + Math.floor(n / 2));
    const rows = Math.min(5, 3 + Math.floor((n - 1) / 2));
    const gapX = Math.min(46 * SCALE, (W - 80 * SCALE) / cols);
    const gapY = 36 * SCALE;
    const startX = (W - (cols - 1) * gapX - 28 * SCALE) / 2;
    const startY = 78 * SCALE;
    const types = ["squid", "crab", "skull"];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const kind = types[Math.min(types.length - 1, Math.floor(r / Math.max(1, Math.floor(rows / 3))))];
        enemies.push({
          x: startX + c * gapX,
          y: startY + r * gapY,
          w: 26 * SCALE, h: 20 * SCALE,
          kind, hp: kind === "skull" ? 2 : 1,
          phase: Math.random() * Math.PI * 2,
          pts: kind === "skull" ? 40 : kind === "crab" ? 20 : 10
        });
      }
    }
    enemyDir = 1;
    enemySpeed = 0.35 + n * 0.07;
    eBullets = [];
    bullets = [];
    if (!powerups) powerups = [];
    ufo = null;
    sfxWave();
  }

  function startGame() {
    ensureAudio();
    if (actx && actx.state === "suspended") actx.resume();
    sfxCoin();
    score = 0; lives = 3; wave = 1; combo = 0;
    bullets = []; eBullets = []; particles = []; powerups = [];
    makePlayer();
    invuln = 80; fireCD = 0;
    state = STATE.WAVE;
    waveMsg = "WAVE 01";
    waveTimer = 80;
    spawnWave(1);
    hint.style.opacity = "0";
  }

  function saveHigh() {
    if (score > high) {
      high = score;
      try { localStorage.setItem("nr_high", String(high)); } catch(e) {}
    }
  }

  function boom(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 3.2 + 0.6;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 28 + Math.random() * 18, max: 40,
        c: color, sz: Math.random() * 3 + 1
      });
    }
  }

  function spawnUfo() {
    if (ufo || Math.random() > 0.004 || state !== STATE.PLAY) return;
    ufo = { x: -40, y: 48 * SCALE, w: 34 * SCALE, h: 14 * SCALE, vx: 1.6 + Math.random(), pts: 50 + Math.floor(Math.random() * 4) * 50 };
  }

  function maybePower(x, y) {
    if (Math.random() > 0.18) return;
    const kinds = ["rapid", "shield", "life"];
    const kind = kinds[Math.floor(Math.random() * (lives < 3 ? 3 : 2))];
    powerups.push({ x, y, w: 16 * SCALE, h: 16 * SCALE, kind, vy: 1.15 });
  }

  let pointerX = null, pointerDown = false;
  function setPointer(clientX, down) {
    pointerX = clientX;
    pointerDown = down;
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    ensureAudio();
    if (actx && actx.state === "suspended") actx.resume();
    setPointer(e.clientX, true);
    if (state === STATE.TITLE || state === STATE.OVER) startGame();
    else if (state === STATE.PLAY) shoot(true);
  }, { passive: false });
  canvas.addEventListener("pointermove", (e) => {
    e.preventDefault();
    if (e.buttons || e.pointerType === "touch") setPointer(e.clientX, true);
  }, { passive: false });
  canvas.addEventListener("pointerup", (e) => { pointerDown = false; });
  canvas.addEventListener("pointercancel", () => { pointerDown = false; });
  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyM") muted = !muted;
    if (e.code === "Space" || e.code === "Enter") {
      if (state === STATE.TITLE || state === STATE.OVER) startGame();
      else shoot(true);
    }
  });

  function shoot(fromTap) {
    if (state !== STATE.PLAY || !player) return;
    const rate = player.rapid > 0 ? 8 : 16;
    if (fireCD > 0 && !fromTap) return;
    if (fromTap && fireCD > rate * 0.4) return;
    const n = player.rapid > 0 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const ox = n === 2 ? (i === 0 ? -6 : 6) * SCALE : 0;
      bullets.push({
        x: player.x + player.w / 2 - 2 + ox,
        y: player.y - 6,
        w: 3 * SCALE, h: 10 * SCALE, vy: -9.5
      });
    }
    fireCD = rate;
    sfxLaser();
  }

  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    titleFlicker++;
    for (const s of stars) {
      s.y += s.v * (state === STATE.PLAY ? 1.4 : 0.7);
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
    if (shake > 0) shake *= 0.86;
    if (flash > 0) flash--;
    if (invuln > 0) invuln--;
    if (fireCD > 0) fireCD--;

    if (state === STATE.WAVE) {
      waveTimer--;
      if (waveTimer <= 0) state = STATE.PLAY;
      return;
    }
    if (state !== STATE.PLAY) return;

    if (pointerDown && pointerX != null) {
      const target = pointerX - player.w / 2;
      player.x += (target - player.x) * 0.28;
    }
    player.x = Math.max(8, Math.min(W - player.w - 8, player.x));
    if (player.rapid > 0) player.rapid--;
    if (player.shield > 0) player.shield--;
    if (pointerDown) shoot(false);

    bullets = bullets.filter(b => { b.y += b.vy; return b.y + b.h > -10; });
    eBullets = eBullets.filter(b => { b.y += b.vy; return b.y < H + 10; });

    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const e of enemies) {
      e.phase += 0.08;
      minX = Math.min(minX, e.x);
      maxX = Math.max(maxX, e.x + e.w);
      maxY = Math.max(maxY, e.y + e.h);
    }
    if (enemies.length) {
      if ((maxX > W - 10 && enemyDir > 0) || (minX < 10 && enemyDir < 0)) {
        enemyDir *= -1;
        dropPending = true;
      }
      const step = enemySpeed * enemyDir * (1 + (1 - enemies.length / 40) * 0.6);
      for (const e of enemies) {
        e.x += step;
        if (dropPending) e.y += 14 * SCALE;
      }
      dropPending = false;
      if (Math.random() < 0.012 + wave * 0.003) {
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        eBullets.push({
          x: shooter.x + shooter.w / 2 - 2,
          y: shooter.y + shooter.h,
          w: 3 * SCALE, h: 9 * SCALE, vy: 3.4 + wave * 0.15
        });
        sfxEnemyShot();
      }
      if (maxY > player.y) {
        lives = 0;
        gameOver();
      }
    }

    spawnUfo();
    if (ufo) {
      ufo.x += ufo.vx;
      if (ufo.x > W + 40) ufo = null;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let used = false;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!hit(b, e)) continue;
        e.hp--;
        used = true;
        sfxHit();
        boom(e.x + e.w / 2, e.y + e.h / 2, e.kind === "skull" ? "#ff6a00" : e.kind === "crab" ? "#ff2bd6" : "#00fff6", 8);
        if (e.hp <= 0) {
          combo++;
          const add = e.pts * Math.min(8, 1 + Math.floor(combo / 4));
          score += add;
          spawnFloat(e.x, e.y, "+" + add);
          maybePower(e.x + e.w / 2, e.y);
          enemies.splice(j, 1);
          shake = Math.min(10, shake + 3);
        }
        break;
      }
      if (!used && ufo && hit(b, ufo)) {
        score += ufo.pts;
        spawnFloat(ufo.x, ufo.y, "+" + ufo.pts + " UFO");
        boom(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, "#ffe14a", 22);
        sfxBoom();
        maybePower(ufo.x + ufo.w / 2, ufo.y);
        ufo = null; used = true; shake = 8;
      }
      if (used) bullets.splice(i, 1);
    }

    if (invuln <= 0) {
      for (let i = eBullets.length - 1; i >= 0; i--) {
        if (!hit(eBullets[i], player)) continue;
        eBullets.splice(i, 1);
        if (player.shield > 0) {
          player.shield = 0;
          boom(player.x + player.w / 2, player.y, "#00fff6", 12);
          sfxHit();
          invuln = 40;
          continue;
        }
        lives--;
        combo = 0;
        invuln = 90;
        flash = 10;
        shake = 14;
        sfxPlayerHit();
        boom(player.x + player.w / 2, player.y + player.h / 2, "#ff2bd6", 24);
        if (lives <= 0) gameOver();
        break;
      }
    }

    powerups = powerups.filter(p => {
      p.y += p.vy;
      if (hit(p, player)) {
        if (p.kind === "rapid") player.rapid = 420;
        if (p.kind === "shield") player.shield = 480;
        if (p.kind === "life" && lives < 5) lives++;
        sfxPower();
        spawnFloat(p.x, p.y, p.kind.toUpperCase());
        return false;
      }
      return p.y < H + 20;
    });

    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
      return p.life > 0;
    });

    if (!enemies.length && state === STATE.PLAY) {
      wave++;
      combo = 0;
      state = STATE.WAVE;
      waveMsg = "WAVE " + String(wave).padStart(2, "0");
      waveTimer = 70;
      spawnWave(wave);
    }
  }

  let floats = [];
  function spawnFloat(x, y, text) {
    floats.push({ x, y, text, life: 50 });
  }

  function gameOver() {
    state = STATE.OVER;
    saveHigh();
    sfxBoom();
    hint.style.opacity = "1";
  }

  function pxFill(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function text(str, x, y, size, color, align = "center") {
    ctx.font = size + "px 'Press Start 2P', monospace";
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function glowText(str, x, y, size, color, glow) {
    ctx.save();
    ctx.shadowColor = glow || color;
    ctx.shadowBlur = 12;
    text(str, x, y, size, color);
    ctx.restore();
    text(str, x, y, size, color);
  }

  function drawShip(x, y, w, h, color, t) {
    pxFill(x + w * 0.35, y + h * 0.35, w * 0.3, h * 0.55, color);
    pxFill(x + w * 0.2, y + h * 0.55, w * 0.6, h * 0.25, color);
    pxFill(x + w * 0.42, y + h * 0.18, w * 0.16, h * 0.28, "#fff");
    pxFill(x, y + h * 0.62, w * 0.22, h * 0.22, color);
    pxFill(x + w * 0.78, y + h * 0.62, w * 0.22, h * 0.22, color);
    pxFill(x + w * 0.45, y, w * 0.1, h * 0.22, "#ffe14a");
    if (Math.floor(t / 6) % 2 === 0) {
      pxFill(x + w * 0.4, y + h, w * 0.2, h * 0.18, "#ff6a00");
      pxFill(x + w * 0.44, y + h + h * 0.14, w * 0.12, h * 0.14, "#ffe14a");
    }
  }

  function drawEnemy(e, t) {
    const { x, y, w, h, kind, phase } = e;
    const bob = Math.sin(phase + t / 10) * 2;
    const yy = y + bob;
    if (kind === "squid") {
      pxFill(x + w * 0.25, yy, w * 0.5, h * 0.45, "#00fff6");
      pxFill(x + w * 0.1, yy + h * 0.35, w * 0.8, h * 0.25, "#00fff6");
      pxFill(x + w * 0.15, yy + h * 0.6, w * 0.15, h * 0.35, "#00fff6");
      pxFill(x + w * 0.7, yy + h * 0.6, w * 0.15, h * 0.35, "#00fff6");
      pxFill(x + w * 0.35, yy + h * 0.12, w * 0.1, h * 0.14, "#050012");
      pxFill(x + w * 0.55, yy + h * 0.12, w * 0.1, h * 0.14, "#050012");
    } else if (kind === "crab") {
      pxFill(x + w * 0.15, yy + h * 0.2, w * 0.7, h * 0.5, "#ff2bd6");
      pxFill(x, yy + h * 0.3, w * 0.18, h * 0.18, "#ff2bd6");
      pxFill(x + w * 0.82, yy + h * 0.3, w * 0.18, h * 0.18, "#ff2bd6");
      pxFill(x + w * 0.2, yy + h * 0.7, w * 0.18, h * 0.28, "#ff2bd6");
      pxFill(x + w * 0.62, yy + h * 0.7, w * 0.18, h * 0.28, "#ff2bd6");
      pxFill(x + w * 0.3, yy + h * 0.32, w * 0.12, h * 0.14, "#fff");
      pxFill(x + w * 0.58, yy + h * 0.32, w * 0.12, h * 0.14, "#fff");
    } else {
      pxFill(x + w * 0.2, yy + h * 0.1, w * 0.6, h * 0.6, "#ff6a00");
      pxFill(x + w * 0.08, yy + h * 0.28, w * 0.18, h * 0.22, "#ff6a00");
      pxFill(x + w * 0.74, yy + h * 0.28, w * 0.18, h * 0.22, "#ff6a00");
      pxFill(x + w * 0.32, yy + h * 0.28, w * 0.12, h * 0.16, "#050012");
      pxFill(x + w * 0.56, yy + h * 0.28, w * 0.12, h * 0.16, "#050012");
      pxFill(x + w * 0.38, yy + h * 0.52, w * 0.24, h * 0.08, "#050012");
      if (e.hp > 1) pxFill(x + w * 0.4, yy - 3, w * 0.2, 3, "#ffe14a");
    }
  }

  function drawUfo(u) {
    pxFill(u.x + u.w * 0.15, u.y + u.h * 0.35, u.w * 0.7, u.h * 0.4, "#ffe14a");
    pxFill(u.x + u.w * 0.3, u.y, u.w * 0.4, u.h * 0.45, "#ff2bd6");
    pxFill(u.x, u.y + u.h * 0.5, u.w, u.h * 0.28, "#ffe14a");
    pxFill(u.x + u.w * 0.18, u.y + u.h * 0.58, 4, 4, "#00fff6");
    pxFill(u.x + u.w * 0.46, u.y + u.h * 0.58, 4, 4, "#00fff6");
    pxFill(u.x + u.w * 0.74, u.y + u.h * 0.58, 4, 4, "#00fff6");
  }

  function drawTitle(t) {
    glowText("NEON", W / 2, H * 0.22, Math.max(22, 28 * SCALE), "#ff2bd6");
    glowText("RAIDERS", W / 2, H * 0.22 + 42 * SCALE, Math.max(18, 24 * SCALE), "#00fff6");
    text("'94  ARCADE  EDITION", W / 2, H * 0.22 + 74 * SCALE, 8 * SCALE, "#ffe14a");
    ctx.globalAlpha = 0.7;
    text("\u25ce  1UP   HI-SCORE   CREDIT 00  \u25ce", W / 2, 28 * SCALE, 8 * SCALE, "#00fff6");
    ctx.globalAlpha = 1;
    const demo = [
      { kind: "squid", x: W / 2 - 90 * SCALE, y: H * 0.42 },
      { kind: "crab", x: W / 2 - 14 * SCALE, y: H * 0.42 },
      { kind: "skull", x: W / 2 + 62 * SCALE, y: H * 0.42 }
    ];
    demo.forEach((d, i) => {
      drawEnemy({ ...d, w: 28 * SCALE, h: 22 * SCALE, phase: t / 8 + i, hp: 1 }, t);
    });
    if (Math.floor(t / 28) % 2 === 0) {
      glowText("TAP TO INSERT COIN", W / 2, H * 0.62, 11 * SCALE, "#ffe14a");
    }
    text("HIGH  " + String(high).padStart(6, "0"), W / 2, H * 0.72, 10 * SCALE, "#fff");
    text("DRAG SHIP  \u00b7  TAP FIRE", W / 2, H * 0.80, 8 * SCALE, "rgba(0,255,246,0.7)");
    text("POWERUPS: RAPID  SHIELD  1UP", W / 2, H * 0.86, 7 * SCALE, "rgba(255,45,214,0.7)");
  }

  function drawHUD() {
    text("1UP", 16 * SCALE, 18 * SCALE, 8 * SCALE, "#ff2bd6", "left");
    text(String(score).padStart(6, "0"), 16 * SCALE, 34 * SCALE, 10 * SCALE, "#fff", "left");
    text("HI", W / 2, 18 * SCALE, 8 * SCALE, "#ffe14a");
    text(String(Math.max(high, score)).padStart(6, "0"), W / 2, 34 * SCALE, 10 * SCALE, "#fff");
    text("WAVE " + String(wave).padStart(2, "0"), W - 16 * SCALE, 18 * SCALE, 8 * SCALE, "#00fff6", "right");
    for (let i = 0; i < lives; i++) {
      drawShip(W - 28 * SCALE - i * 26 * SCALE, 28 * SCALE, 16 * SCALE, 12 * SCALE, "#00fff6", 0);
    }
    if (player && player.rapid > 0) {
      text("RAPID", W / 2, H - 18 * SCALE, 8 * SCALE, "#ffe14a");
    }
    if (player && player.shield > 0) {
      ctx.strokeStyle = "rgba(0,255,246,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w * 0.85, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawGameOver(t) {
    ctx.fillStyle = "rgba(5,0,18,0.55)";
    ctx.fillRect(0, 0, W, H);
    glowText("GAME OVER", W / 2, H * 0.38, 22 * SCALE, "#ff2bd6");
    text("SCORE  " + String(score).padStart(6, "0"), W / 2, H * 0.48, 12 * SCALE, "#fff");
    text("BEST   " + String(high).padStart(6, "0"), W / 2, H * 0.55, 12 * SCALE, "#ffe14a");
    if (Math.floor(t / 28) % 2 === 0) {
      glowText("TAP TO CONTINUE", W / 2, H * 0.68, 11 * SCALE, "#00fff6");
    }
  }

  function frame(ts) {
    if (!lastT) lastT = ts;
    const dt = Math.min(32, ts - lastT);
    lastT = ts;
    update(dt);

    ctx.save();
    if (shake > 0.4) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    ctx.fillStyle = "#050012";
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.5, H * 0.25, 10, W * 0.5, H * 0.3, Math.max(W, H) * 0.7);
    g.addColorStop(0, "rgba(80,0,90,0.25)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = 0.4 + (s.s / 2);
      pxFill(s.x, s.y, s.s, s.s, s.c);
    }
    ctx.globalAlpha = 1;

    if (state === STATE.TITLE) {
      drawTitle(titleFlicker);
    } else {
      if (ufo) drawUfo(ufo);
      for (const e of enemies) drawEnemy(e, titleFlicker);
      for (const b of bullets) pxFill(b.x, b.y, b.w, b.h, "#ffe14a");
      for (const b of eBullets) {
        pxFill(b.x, b.y, b.w, b.h, "#ff2bd6");
        pxFill(b.x + 0.5, b.y + 2, b.w - 1, 3, "#fff");
      }
      for (const p of powerups) {
        const col = p.kind === "life" ? "#7CFF6B" : p.kind === "shield" ? "#00fff6" : "#ffe14a";
        pxFill(p.x, p.y, p.w, p.h, col);
        text(p.kind === "life" ? "1" : p.kind === "shield" ? "S" : "R", p.x + p.w / 2, p.y + p.h / 2, 8 * SCALE, "#050012");
      }
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.max;
        pxFill(p.x, p.y, p.sz, p.sz, p.c);
      }
      ctx.globalAlpha = 1;
      for (const f of floats) {
        f.y -= 0.6; f.life--;
        ctx.globalAlpha = Math.max(0, f.life / 50);
        text(f.text, f.x, f.y, 8 * SCALE, "#ffe14a");
      }
      floats = floats.filter(f => f.life > 0);
      ctx.globalAlpha = 1;

      if (player && (invuln <= 0 || Math.floor(titleFlicker / 4) % 2 === 0)) {
        drawShip(player.x, player.y, player.w, player.h, "#00fff6", titleFlicker);
      }
      drawHUD();

      if (state === STATE.WAVE) {
        glowText(waveMsg, W / 2, H * 0.45, 18 * SCALE, "#ffe14a");
        text("GET READY", W / 2, H * 0.45 + 32 * SCALE, 10 * SCALE, "#00fff6");
      }
      if (state === STATE.OVER) drawGameOver(titleFlicker);
    }

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,80,180," + (flash / 18) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  resetStars();
  makePlayer();
  enemies = [];
  bullets = []; eBullets = []; particles = []; powerups = [];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
