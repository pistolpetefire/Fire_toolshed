<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Toolshed" />
<meta name="theme-color" content="#2a2d32" />
<title>TOOLSHED</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1c140c; color: #f4efe4; font-family: "Press Start 2P", monospace; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .desk { width: min(460px, 100%); }
  .unit {
    background:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,.35), transparent 26%),
      linear-gradient(180deg, #d7c4a3, #b89a72 40%, #8d704c);
    border-radius: 42px 42px 36px 36px;
    padding: 18px 16px 22px;
    border: 3px solid #5c4630;
    box-shadow: 0 28px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
    position: relative;
  }
  .screw { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #8d929a; box-shadow: inset 0 0 0 2px #5c6168; }
  .screw:before { content: ""; position: absolute; left: 2px; top: 4px; width: 6px; height: 1px; background: #3c4046; }
  .s1 { left: 14px; top: 14px; } .s2 { right: 14px; top: 14px; } .s3 { left: 14px; bottom: 14px; } .s4 { right: 14px; bottom: 14px; }
  .slot-well { margin: 0 36px 12px; background: #2a2118; border-radius: 0 0 12px 12px; padding: 0 10px 8px; box-shadow: inset 0 10px 12px rgba(0,0,0,.55); }
  .inserted { height: 36px; border-radius: 0 0 6px 6px; border: 2px solid #1a120c; border-top: 0; position: relative; }
  .inserted:after { content: attr(data-name); position: absolute; left: 10px; right: 10px; bottom: 6px; background: #f7f1e4; color: #1a120c; font-size: 7px; padding: 4px 6px; }
  .screen-bezel { background: #15181d; border-radius: 16px; padding: 10px; box-shadow: inset 0 0 0 2px #0a0c10; }
  .screen {
    background: #07140e; border-radius: 8px; min-height: 300px; position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 3px #0b1c14, inset 0 0 24px rgba(0,0,0,.45);
  }
  .screen:before { content: ""; pointer-events: none; position: absolute; inset: 0; z-index: 3;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  .glass { pointer-events: none; position: absolute; inset: 0; z-index: 4; background: linear-gradient(115deg, rgba(255,255,255,.08), transparent 32%); }
  .boot, .menu { position: relative; z-index: 1; padding: 14px 12px 12px; }
  .brand { color: #b6f25c; font-size: 13px; letter-spacing: 1px; text-align: center; margin: 6px 0 4px; }
  .sub { color: #7d8a72; font-size: 8px; text-align: center; line-height: 1.7; }
  .cart {
    display: grid; grid-template-columns: 18px 1fr; gap: 8px; width: 100%; text-align: left; margin-top: 8px;
    background: var(--shell, #c23b3b); color: #1a120c; border: 0; border-radius: 4px 4px 7px 7px;
    padding: 0; font-family: inherit; min-height: 54px; box-shadow: 0 3px 0 #1a120c;
  }
  .ridge { background: repeating-linear-gradient(#1a120c 0 2px, transparent 2px 5px); border-radius: 3px 0 0 6px; }
  .label { background: #f4efe4; margin: 6px 6px 6px 0; border-radius: 2px; padding: 6px 7px; text-align: left; }
  .label b { display: block; font-size: 8px; font-weight: 400; }
  .label small { display: block; color: #5c5348; font-size: 7px; margin-top: 4px; line-height: 1.45; }
  .cart.on { outline: 2px solid #f4efe4; transform: translateY(-1px); }
  .plate { display: flex; justify-content: space-between; align-items: center; font-size: 7px; letter-spacing: 1px; color: #3a2a1c; margin: 12px 8px 8px; }
  .grille { width: 54px; height: 16px; background: repeating-linear-gradient(90deg, #1a1d22 0 2px, transparent 2px 4px); border-radius: 3px; }
  .controls { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 0; }
  .pad { width: 86px; height: 86px; position: relative; }
  .pad i { position: absolute; background: linear-gradient(#f0c44a, #c99216); border-radius: 6px; box-shadow: 0 3px 0 #6d5010; }
  .pad .h { left: 0; top: 31px; width: 86px; height: 24px; }
  .pad .v { left: 31px; top: 0; width: 24px; height: 86px; }
  .mid { width: 14px; height: 14px; left: 36px; top: 36px; background: #8a6412; border-radius: 3px; position: absolute; }
  .btns { display: flex; gap: 14px; align-items: end; }
  .btn { border: 0; border-radius: 50%; font-family: inherit; box-shadow: 0 4px 0 #4a3010; }
  .b { width: 52px; height: 52px; background: #e2b423; color: #1a1208; font-size: 10px; }
  .a { width: 66px; height: 66px; background: #d23b2f; color: #fff; font-size: 12px; box-shadow: 0 4px 0 #6e1c16; }
  .selects { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }
  .pill { border: 0; background: #6b5340; color: #f4efe4; font-family: inherit; font-size: 7px; border-radius: 8px; padding: 6px 10px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 10px #ff2a2a; }
</style>
</head>
<body>
  <div class="desk">
    <div class="unit">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <div class="slot-well"><div class="inserted" id="inserted"></div></div>
      <div class="screen-bezel">
        <div class="screen" id="screen">
          <div class="glass"></div>
          <div class="boot" id="boot">
            <div class="brand">TOOLSHED</div>
            <div class="sub">PORTABLE ARCADE<br>INSERT CARTRIDGE</div>
          </div>
          <div class="menu" id="menu" hidden></div>
        </div>
      </div>
      <div class="plate"><span>TOOLSHED</span><span class="grille"></span><i class="led"></i></div>
      <div class="controls">
        <div class="pad" aria-hidden="true"><i class="h"></i><i class="v"></i><i class="mid"></i></div>
        <div class="btns">
          <button class="btn b" id="bBtn" type="button">B</button>
          <button class="btn a" id="aBtn" type="button">A</button>
        </div>
      </div>
      <div class="selects">
        <button class="pill" id="sel" type="button">SELECT</button>
        <button class="pill" id="start" type="button">START</button>
      </div>
    </div>
  </div>
<script>
const games = [
  { id: "rise", name: "HIGH RISE", blurb: "Climb. Soak the windows.", href: "../high-rise/?v=cross", shell: "#c23b3b" },
  { id: "wand", name: "WAND RAIDERS", blurb: "Tap to cast.", href: "../wand/", shell: "#6d28d9" },
  { id: "punch", name: "PUNCH-OUT", blurb: "Dodge and counter.", href: "../punch-out/", shell: "#b45309" },
  { id: "frog", name: "FROGGER", blurb: "Cross the pads.", href: "../frogger/?v=go", shell: "#15803d" },
  { id: "pac", name: "MS PAC", blurb: "Pellets and ghosts.", href: "../ms-pac/", shell: "#be185d" }
];
let idx = 0;
const boot = document.getElementById("boot");
const menu = document.getElementById("menu");
const inserted = document.getElementById("inserted");
function render() {
  menu.innerHTML = games.map((g, i) =>
    `<button class="cart${i === idx ? " on" : ""}" data-i="${i}" type="button" style="--shell:${g.shell}"><i class="ridge"></i><span class="label"><b>${g.name}</b><small>${g.blurb}</small></span></button>`
  ).join("");
  inserted.style.background = games[idx].shell; inserted.dataset.name = games[idx].name;
}
function showMenu() {
  boot.hidden = true;
  menu.hidden = false;
  boot.innerHTML = '<div class="brand">TOOLSHED</div><div class="sub">PORTABLE ARCADE<br>INSERT CARTRIDGE</div>';
  render();
}
setTimeout(showMenu, 700);
window.addEventListener("pageshow", showMenu);
menu.addEventListener("click", (e) => {
  const btn = e.target.closest(".cart");
  if (!btn) return;
  idx = Number(btn.dataset.i);
  render();
});
function launch() {
  const g = games[idx];
  boot.hidden = false;
  menu.hidden = true;
  boot.innerHTML = `<div class="brand">LOADING</div><div class="sub">${g.name}</div>`;
  setTimeout(() => { location.href = g.href; }, 350);
}
document.getElementById("aBtn").addEventListener("click", launch);
document.getElementById("start").addEventListener("click", launch);
document.getElementById("bBtn").addEventListener("click", () => { idx = (idx + 1) % games.length; render(); });
document.getElementById("sel").addEventListener("click", () => { idx = (idx + 1) % games.length; render(); });
</script>
</body>
</html>
