(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const imgs = {};
  let ready = 0;
  for (const k of ["building","hero","f1","f2","f3","f4"]) {
    const im = new Image();
    im.onload = () => { ready++; };
    im.src = ART[k];
    imgs[k] = im;
  }
  let W = 0, H = 0, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W / 390, H / 700);
  }
  addEventListener("resize", resize); resize();

  const FLOORS = 5, WINS = 4;
  const ladderX = [0.38, 0.46, 0.33];
  const winX = [0.22, 0.42, 0.62, 0.82];
  let state = "title", score = 0, high = 0, lives = 3, wave = 1, tick = 0;
  try { high = parseInt(localStorage.getItem("hr_high") || "0", 10) || 0; } catch (e) {}
  let player, fires, embers, keys = {};
  let spraying = false;

  function bld() {
    const bh = Math.min(H * 0.78, W * 1.35);
    const bw = bh * 0.66;
    return { x: (W - bw) / 2, y: H * 0.08, w: bw, h: bh };
  }
  function floorY(i) {
    const b = bld();
    return b.y + b.h * (0.86 - i * 0.155);
  }
  function wx(col) { const b = bld(); return b.x + b.w * winX[col]; }
  function lx(i) { const b = bld(); return b.x + b.w * ladderX[i]; }

  function resetFires() {
    fires = [];
    const n = Math.min(7, 3 + wave);
    const used = new Set();
    while (fires.length < n) {
      const f = 1 + Math.floor(Math.random() * 4);
      const c = Math.floor(Math.random() * WINS);
      const k = f + "-" + c;
      if (used.has(k)) continue;
      used.add(k);
      fires.push({ f, c, hp: 28, max: 100 });
    }
    embers = [];
    for (let i = 0; i < Math.min(3, wave); i++) {
      embers.push({ f: Math.floor(Math.random() * FLOORS), x: 0.2 + Math.random() * 0.6, v: Math.random() < 0.5 ? -0.002 : 0.002 });
    }
  }
  function start() {
    score = 0; lives = 3; wave = 1;
    player = { f: 0, x: 0.38, dir: 1, climb: 0 };
    resetFires();
    state = "play";
  }
  function nearLadder() {
    for (let i = 0; i < ladderX.length; i++) if (Math.abs(player.x - ladderX[i]) < 0.1) return i;
    return -1;
  }
  function nearestFire() {
    let best = null, bd = 0.09;
    for (const fr of fires) {
      if (fr.f !== player.f) continue;
      const d = Math.abs(player.x - winX[fr.c]);
      if (d < bd) { bd = d; best = fr; }
    }
    return best;
  }
  function douse(fr, amount) {
    fr.hp -= amount;
    if (fr.hp > 0) return;
    score += 50 * wave;
    const below = fires.find(o => o !== fr && o.c === fr.c && o.f === fr.f - 1);
    fires = fires.filter(o => o !== fr);
    if (below) { below.hp -= 40; if (below.hp <= 0) { score += 80; fires = fires.filter(o => o !== below); } }
    if (!fires.length) { wave++; state = "wave"; setTimeout(() => { if (state === "wave") { resetFires(); state = "play"; } }, 900); }
  }
  function hit() {
    lives--;
    player.x = 0.38; player.f = 0;
    if (lives <= 0) { state = "over"; if (score > high) { high = score; try { localStorage.setItem("hr_high", String(high)); } catch (e) {} } }
  }
  function update() {
    tick++;
    if (state !== "play") return;
    const lad = nearLadder();
    if (keys.left) { player.x -= 0.006; player.dir = -1; player.climb = 0; }
    if (keys.right) { player.x += 0.006; player.dir = 1; player.climb = 0; }
    player.x = Math.max(0.12, Math.min(0.9, player.x));
    if (keys.up && lad >= 0 && player.f < FLOORS - 1) { player.climb++; if (player.climb > 10) { player.f++; player.x = ladderX[lad]; player.climb = 0; } }
    else if (keys.down && lad >= 0 && player.f > 0) { player.climb++; if (player.climb > 10) { player.f--; player.x = ladderX[lad]; player.climb = 0; } }
    else player.climb = 0;
    if (spraying || keys.spray) {
      const fr = nearestFire();
      if (fr) douse(fr, 1.4);
    }
    for (const fr of fires) { if (!(spraying || keys.spray) || nearestFire() !== fr) fr.hp = Math.min(fr.max, fr.hp + 0.045); }
    for (const e of embers) {
      e.x += e.v;
      if (e.x < 0.14 || e.x > 0.88) e.v *= -1;
      if (e.f === player.f && Math.abs(e.x - player.x) < 0.05) hit();
    }
  }
  function text(s, x, y, size, color, align) {
    ctx.font = size + "px 'Press Start 2P', monospace";
    ctx.textAlign = align || "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function frame() {
    update();
    ctx.fillStyle = "#1a0c22"; ctx.fillRect(0, 0, W, H);
    const b = bld();
    if (ready >= 6) ctx.drawImage(imgs.building, b.x, b.y, b.w, b.h);
    for (let f = 0; f < FLOORS; f++) {
      const y = floorY(f);
      ctx.fillStyle = "rgba(90,42,32,.55)"; ctx.fillRect(b.x + 8, y, b.w - 16, 6);
      /* fire escape is painted on the brownstone */
    }
    for (const fr of fires) {
      const x = wx(fr.c), y = floorY(fr.f) - 34 * S;
      const flick = 1 + Math.sin(tick / 5 + fr.c) * 0.04;
      const st = fr.hp > fr.max * 0.75 ? 4 : fr.hp > fr.max * 0.5 ? 3 : fr.hp > fr.max * 0.25 ? 2 : 1;
      const spr = imgs["f" + st];
      const dw = (30 + st * 8) * S * flick, dh = (40 + st * 10) * S;
      if (ready >= 6 && spr) ctx.drawImage(spr, x - dw / 2, y - dh * 0.55, dw, dh);
    }
    if (player && ready >= 6 && state !== "title") {
      const px = b.x + b.w * player.x;
      const py = floorY(player.f) - 52 * S;
      ctx.save();
      ctx.translate(px, py);
      if (player.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(imgs.hero, -22 * S, -8 * S, 48 * S, 64 * S);
      ctx.restore();
      if (spraying || keys.spray) {
        ctx.strokeStyle = "#9ad7ff"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px + player.dir * 16, py + 16); ctx.lineTo(px + player.dir * 46, py + 8); ctx.stroke();
      }
    }
    for (const e of embers || []) {
      ctx.fillStyle = "#ff6a1a";
      ctx.beginPath(); ctx.arc(b.x + b.w * e.x, floorY(e.f) - 8, 6, 0, 7); ctx.fill();
    }
    text("HIGH RISE", 12, 18, 10, "#ffe14a", "left");
    text(String(score).padStart(5, "0"), W - 12, 18, 10, "#fff", "right");
    text("LIVES " + lives, 12, 36, 8, "#ffb347", "left");
    if (state === "play" && player && player.f === 0) text(nearLadder() >= 0 ? "UP TO CLIMB" : "WALK TO ESCAPE", W / 2, H - 78, 8, "#ffe14a");
    if (state === "title") {
      ctx.fillStyle = "rgba(8,4,12,.45)"; ctx.fillRect(0, 0, W, H);
      text("HIGH RISE", W / 2, H * 0.32, 22 * S, "#ffe14a");
      text("CLIMB  SWITCH LADDERS", W / 2, H * 0.42, 8 * S, "#fff");
      text("SOAK THE WINDOWS", W / 2, H * 0.48, 8 * S, "#fff");
      text("TAP FLOW TO START", W / 2, H * 0.6, 10 * S, "#9ad7ff");
    }
    if (state === "wave") text("FLOOR CLEAR", W / 2, H * 0.2, 12 * S, "#b6f25c");
    if (state === "over") {
      ctx.fillStyle = "rgba(8,4,12,.55)"; ctx.fillRect(0, 0, W, H);
      text("BUILDING LOST", W / 2, H * 0.4, 14 * S, "#e23b2f");
      text("TAP FLOW", W / 2, H * 0.52, 10 * S, "#ffe14a");
    }
    requestAnimationFrame(frame);
  }
  function setKey(k, v) { keys[k] = v; }
  function bind(id, k) {
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); setKey(k, true); };
    const off = (e) => { e.preventDefault(); setKey(k, false); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }
  bind("l", "left"); bind("r", "right"); bind("u", "up"); bind("d", "down");
  const spray = document.getElementById("spray");
  spray.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    spraying = true;
    if (state === "title" || state === "over") start();
  });
  spray.addEventListener("pointerup", () => spraying = false);
  spray.addEventListener("pointercancel", () => spraying = false);
  addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft") keys.left = true;
    if (e.code === "ArrowRight") keys.right = true;
    if (e.code === "ArrowUp") keys.up = true;
    if (e.code === "ArrowDown") keys.down = true;
    if (e.code === "Space") { keys.spray = true; if (state !== "play") start(); }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft") keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
    if (e.code === "ArrowUp") keys.up = false;
    if (e.code === "ArrowDown") keys.down = false;
    if (e.code === "Space") keys.spray = false;
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
