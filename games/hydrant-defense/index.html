<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>HYDRANT DEFENSE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  html, body { margin: 0; width: 100%; height: 100%; background: #14171c; overflow: hidden; font-family: "Press Start 2P", monospace; color: #f4d35e; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #scan { pointer-events: none; position: fixed; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px); }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 9px; color: rgba(244,211,94,0.75); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan"></div>
<div id="hint">DRAG TO MOVE  ·  HOLD TO OPEN THE LINE</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  let W = 0, H = 0, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.75, Math.min(W / 390, H / 700));
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  resize();
  let actx = null, master = null, muted = false;
  function ensureAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.28;
    master.connect(actx.destination);
  }
  function beep(freq, dur, type, vol) {
    if (!actx || muted) return;
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  const TITLE = 0, PLAY = 1, WAVE = 2, OVER = 3;
  let state = TITLE, score = 0, high = 0, lives = 3, wave = 1;
  try { high = parseInt(localStorage.getItem("hd_high") || "0", 10) || 0; } catch (e) {}
  let player, hydrants, fires, drops, sparks, spots;
  let pointerX = null, spraying = false, fireCD = 0, waveTimer = 0, tick = 0, shake = 0, tank = 100;
  let spawnIn = 40;
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  function text(str, x, y, size, color, align) {
    ctx.font = size + "px 'Press Start 2P', monospace";
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function glow(str, x, y, size, color) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 12; text(str, x, y, size, color); ctx.restore();
    text(str, x, y, size, color);
  }
  function layoutHydrants() {
    hydrants = [];
    const cols = 5;
    const gap = (W - 40) / cols;
    for (let i = 0; i < cols; i++) {
      hydrants.push({ x: 20 + gap * i + gap / 2, y: H * 0.62, on: false });
      hydrants.push({ x: 20 + gap * i + gap / 2, y: H * 0.78, on: false });
    }
  }
  function makePlayer() { player = { x: W / 2, y: H - 78 * S, w: 28 * S, h: 34 * S }; }
  function startGame() {
    ensureAudio();
    beep(523, 0.08, "square", 0.25);
    setTimeout(() => beep(784, 0.12, "square", 0.25), 90);
    score = 0; lives = 3; wave = 1; tank = 100; fires = []; drops = []; sparks = []; spots = [];
    makePlayer(); layoutHydrants(); spawnIn = 30; state = WAVE; waveTimer = 70; hint.style.opacity = "0";
  }
  function saveHigh() { if (score > high) { high = score; try { localStorage.setItem("hd_high", String(high)); } catch (e) {} } }
  function laneX(i) { const cols = 5, gap = (W - 40) / cols; return 20 + gap * i + gap / 2; }
  function nearestHydrant() {
    let best = null, bd = 46 * S;
    for (const h of hydrants) { const d = Math.hypot(h.x - player.x, h.y - player.y); if (d < bd) { bd = d; best = h; } }
    return best;
  }
  function hooked() { return !!nearestHydrant(); }
  function flow() { return hooked() ? 500 : Math.max(80, Math.round(150 * tank / 100)); }
  function spawnFire() {
    const lane = Math.floor(Math.random() * 5);
    const hp = 2 + Math.floor(wave / 2);
    fires.push({ x: laneX(lane), y: 70 * S, w: 26 * S, h: 32 * S, hp, max: hp, vy: 0.35 + wave * 0.06, lane, phase: Math.random() * 6 });
  }
  function spawnSpot() {
    if (Math.random() > 0.35) return;
    spots.push({ x: laneX(Math.floor(Math.random() * 5)), y: H * 0.42, w: 22 * S, h: 22 * S, hp: 3, life: 420 });
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    pointerX = e.clientX; spraying = true;
    ensureAudio();
    if (actx && actx.state === "suspended") actx.resume();
    beep(180, 0.04, "square", 0.08);
    if (state === TITLE || state === OVER) startGame();
  }, { passive: false });
  canvas.addEventListener("pointermove", (e) => {
    e.preventDefault();
    if (e.buttons || e.pointerType === "touch") { pointerX = e.clientX; spraying = true; }
  }, { passive: false });
  canvas.addEventListener("pointerup", () => { spraying = false; });
  canvas.addEventListener("pointercancel", () => { spraying = false; });
  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyM") muted = !muted;
    if (e.code === "Space" || e.code === "Enter") {
      ensureAudio();
      if (actx && actx.state === "suspended") actx.resume();
      if (state === TITLE || state === OVER) startGame(); else spraying = true;
    }
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") spraying = false; });
  function spray() {
    if (fireCD > 0) return;
    if (!hooked()) { tank -= 0.55; if (tank <= 0) { tank = 0; return; } }
    else tank = Math.min(100, tank + 0.4);
    const hook = nearestHydrant();
    const ox = player.x + (hook ? (hook.x - player.x) * 0.15 : 0);
    const power = hooked() ? 1 : 0.45;
    for (let i = 0; i < (hooked() ? 5 : 2); i++) {
      drops.push({ x: ox + (Math.random() - 0.5) * 10, y: player.y - 8, vx: (Math.random() - 0.5) * 0.8, vy: -7.2 - Math.random() * 2.4, life: hooked() ? 28 : 16, power });
    }
    fireCD = hooked() ? 2 : 4;
    if (tick % 8 === 0) beep(hooked() ? 240 : 160, 0.04, "square", 0.05);
  }
  function update() {
    tick++;
    if (shake > 0) shake *= 0.86;
    if (fireCD > 0) fireCD--;
    if (state === WAVE) { waveTimer--; if (waveTimer <= 0) { state = PLAY; spawnIn = 20; } return; }
    if (state !== PLAY) return;
    if (pointerX != null) player.x += (pointerX - player.x) * 0.28;
    player.x = Math.max(24, Math.min(W - 24, player.x));
    if (spraying) spray();
    for (const h of hydrants) h.on = Math.hypot(h.x - player.x, h.y - player.y) < 42 * S;
    spawnIn--;
    if (spawnIn <= 0) { spawnFire(); if (wave > 2 && Math.random() < 0.25) spawnFire(); spawnIn = Math.max(28, 78 - wave * 6); }
    if (tick % 500 === 0) spawnSpot();
    for (const f of fires) { f.y += f.vy; f.phase += 0.2; }
    for (const s of spots) s.life--;
    drops = drops.filter(d => { d.x += d.vx; d.y += d.vy; d.life--; return d.life > 0 && d.y > 40; });
    for (const d of drops) {
      for (const f of fires) {
        if (Math.abs(d.x - f.x) < f.w * 0.7 && Math.abs(d.y - f.y) < f.h * 0.7) {
          f.hp -= d.power; d.life = 0;
          sparks.push({ x: d.x, y: d.y, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random(), life: 16, c: "#9ad7ff" });
        }
      }
      for (const s of spots) { if (Math.abs(d.x - s.x) < 18 * S && Math.abs(d.y - s.y) < 18 * S) { s.hp -= d.power; d.life = 0; } }
    }
    for (let i = fires.length - 1; i >= 0; i--) {
      const f = fires[i];
      if (f.hp <= 0) {
        score += Math.round((10 + wave * 2) * (flow() / 150));
        beep(420, 0.06, "square", 0.16);
        for (let k = 0; k < 8; k++) sparks.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 20, c: "#ffb347" });
        fires.splice(i, 1);
      } else if (f.y > player.y - 10) {
        fires.splice(i, 1); lives--; shake = 12; beep(110, 0.28, "sawtooth", 0.3);
        if (lives <= 0) { state = OVER; saveHigh(); hint.style.opacity = "1"; beep(90, 0.4, "square", 0.3); }
      }
    }
    for (let i = spots.length - 1; i >= 0; i--) {
      if (spots[i].hp <= 0) { score += 100; tank = 100; spots.splice(i, 1); beep(660, 0.1, "square", 0.22); }
      else if (spots[i].life <= 0) spots.splice(i, 1);
    }
    sparks = sparks.filter(p => { p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0; });
    if (tick % 900 === 0 && state === PLAY) { wave++; state = WAVE; waveTimer = 60; }
  }
  function drawApron() {
    ctx.fillStyle = "#6d727a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#5c6168";
    for (let y = 0; y < H; y += 28) ctx.fillRect(0, y, W, 2);
    ctx.strokeStyle = "#e2b423"; ctx.lineWidth = 3;
    const cols = 5, gap = (W - 40) / cols;
    for (let i = 0; i <= cols; i++) { ctx.beginPath(); ctx.moveTo(20 + gap * i, 64); ctx.lineTo(20 + gap * i, H - 24); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(16, H - 36); ctx.lineTo(W - 16, H - 36); ctx.stroke();
  }
  function drawHydrant(h) {
    const x = h.x, y = h.y, s = 7 * S;
    px(x - s, y - s * 1.6, s * 2, s * 2.5, h.on ? "#ff4d3a" : "#c42828");
    px(x - s * 1.4, y - s * 0.2, s * 0.7, s * 0.7, "#d7a441");
    px(x + s * 0.7, y - s * 0.2, s * 0.7, s * 0.7, "#d7a441");
    px(x - s * 0.45, y - s * 2.2, s * 0.9, s * 0.7, "#d7a441");
    if (h.on) px(x - 2, y - s * 2.8, 4, 4, "#9ad7ff");
  }
  function drawPlayer() {
    const x = player.x, y = player.y, s = S;
    px(x - 8 * s, y - 4 * s, 16 * s, 18 * s, "#e6b325");
    px(x - 7 * s, y + 12 * s, 6 * s, 10 * s, "#2c3038");
    px(x + 1 * s, y + 12 * s, 6 * s, 10 * s, "#2c3038");
    px(x - 6 * s, y - 14 * s, 12 * s, 10 * s, "#e6b325");
    px(x - 3 * s, y - 10 * s, 8 * s, 4 * s, "#1b1e24");
    px(x + 6 * s, y - 2 * s, 10 * s, 4 * s, "#8a8f98");
    ctx.strokeStyle = "#8a6a32"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y + 16 * s); ctx.lineTo(x - 6 * s, H - 8); ctx.stroke();
  }
  function drawFire(f) {
    const flick = Math.sin(f.phase) * 3;
    px(f.x - 8 * S, f.y + 6 * S, 16 * S, 10 * S, "#2a2a2a");
    px(f.x - 6 * S, f.y - 6 * S + flick, 12 * S, 16 * S, "#ff5a1f");
    px(f.x - 3 * S, f.y - 14 * S + flick, 6 * S, 12 * S, "#ffd15c");
  }
  function drawHUD() {
    text("FLOW " + flow() + " GPM", 12 * S, 22 * S, 8 * S, flow() >= 500 ? "#ffe14a" : "#fff", "left");
    text("LIVES", W / 2, 16 * S, 8 * S, "#ffe14a");
    for (let i = 0; i < lives; i++) {
      px(W / 2 - 28 * S + i * 18 * S, 26 * S, 12 * S, 8 * S, "#e6b325");
      px(W / 2 - 26 * S + i * 18 * S, 24 * S, 8 * S, 4 * S, "#1b1e24");
    }
    text("SCORE", W - 12 * S, 16 * S, 8 * S, "#ffe14a", "right");
    text(String(score).padStart(6, "0"), W - 12 * S, 32 * S, 10 * S, "#fff", "right");
    text(hooked() ? "HOOKED UP" : "TANK " + Math.round(tank) + "%", W / 2, H - 16 * S, 8 * S, hooked() ? "#9ad7ff" : "#ffb347");
  }
  function drawTitle() {
    glow("HYDRANT", W / 2, H * 0.22, Math.max(20, 26 * S), "#e23b2f");
    glow("DEFENSE", W / 2, H * 0.22 + 40 * S, Math.max(18, 24 * S), "#ffe14a");
    text("HARDSTAND  HOLD", W / 2, H * 0.22 + 72 * S, 8 * S, "#9ad7ff");
    drawHydrant({ x: W / 2 - 70 * S, y: H * 0.48, on: true });
    const saved = { x: player.x, y: player.y };
    player.x = W / 2 + 10 * S; player.y = H * 0.46;
    drawPlayer();
    player.x = saved.x; player.y = saved.y;
    drawFire({ x: W / 2 + 78 * S, y: H * 0.42, phase: tick / 5 });
    if (Math.floor(tick / 28) % 2 === 0) glow("TAP TO START", W / 2, H * 0.66, 11 * S, "#ffe14a");
    text("HIGH  " + String(high).padStart(6, "0"), W / 2, H * 0.76, 10 * S, "#fff");
    text("DRAG  ·  HOLD TO FLOW", W / 2, H * 0.84, 8 * S, "#9ad7ff");
  }
  function frame() {
    update();
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawApron();
    if (state === TITLE) { makePlayer(); drawTitle(); }
    else {
      for (const h of hydrants) drawHydrant(h);
      for (const s of spots) { px(s.x - 8 * S, s.y - 8 * S, 16 * S, 16 * S, "#ff9a3c"); text("SPOT", s.x, s.y - 16 * S, 7 * S, "#fff"); }
      for (const f of fires) drawFire(f);
      for (const d of drops) px(d.x, d.y, 3, 8, "#bfe9ff");
      for (const p of sparks) { ctx.globalAlpha = Math.max(0, p.life / 20); px(p.x, p.y, 3, 3, p.c); }
      ctx.globalAlpha = 1;
      if (state !== OVER) drawPlayer();
      drawHUD();
      if (state === WAVE) { glow("WAVE " + String(wave).padStart(2, "0"), W / 2, H * 0.4, 18 * S, "#ffe14a"); text("HOLD THE PAD", W / 2, H * 0.4 + 28 * S, 9 * S, "#ff5a1f"); }
      if (state === OVER) {
        ctx.fillStyle = "rgba(12,14,18,0.55)"; ctx.fillRect(0, 0, W, H);
        glow("PAD LOST", W / 2, H * 0.38, 20 * S, "#e23b2f");
        text("SCORE  " + String(score).padStart(6, "0"), W / 2, H * 0.5, 11 * S, "#fff");
        text("BEST   " + String(high).padStart(6, "0"), W / 2, H * 0.58, 11 * S, "#ffe14a");
        if (Math.floor(tick / 28) % 2 === 0) glow("TAP TO RETRY", W / 2, H * 0.7, 11 * S, "#9ad7ff");
      }
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }
  fires = []; drops = []; sparks = []; spots = []; hydrants = [];
  makePlayer();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
