stem: |
  Steady one-dimensional conduction through a gypsum partition. Thermal conductivity k = 0.17 W/m·K (given). Thickness L = 16 mm. Exposed area A = 12 m². Surface temperatures are 120 °C on the fire side and 40 °C on the unexposed face.

  Fourier’s law as used in the handbook: q = k A ΔT / L.

  Report the conductive heat-transfer rate, in kW, to the nearest 0.1 kW.
numeric:
  value: 10.2
  unit: kW
  sig_figs: 3
  tolerance_pct: 2
  report_as: nearest 0.1 kW
answer: 10.2
solution:
  outline: |
    HB §3.3 Heat Transfer, Fourier’s law (stated in the stem).
    L = 0.016 m, ΔT = 80 K
    q = (0.17 W/m·K)(12 m²)(80 K) / (0.016 m) = 163.2 / 0.016 = 10,200 W = 10.2 kW.
  miss_type: arithmetic
  repair_loci:
    - HB §3.3 Heat Transfer
distractor_notes: "Leaving L in mm (q off by 1000) or reporting 10200 kW instead of 10.2 kW; using ΔT = 120 °C without subtracting the unexposed face."
