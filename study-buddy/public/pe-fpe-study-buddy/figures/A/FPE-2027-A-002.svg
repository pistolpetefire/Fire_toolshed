<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Atrium two-zone schematic</title>
  <desc id="desc">Section through a 14 m hotel atrium. Lobby fire on the floor, smoke layer under the roof, exhaust at high level, and a downward makeup-air jet from a roof monitor.</desc>
  <rect width="640" height="400" fill="#f4f1ea"/>
  <!-- building section -->
  <rect x="60" y="40" width="520" height="320" fill="#fff" stroke="#1b365d" stroke-width="3"/>
  <!-- roof -->
  <line x1="60" y1="40" x2="580" y2="40" stroke="#1b365d" stroke-width="6"/>
  <!-- floor -->
  <rect x="60" y="340" width="520" height="20" fill="#c4b8a4"/>
  <!-- smoke layer -->
  <rect x="62" y="42" width="516" height="110" fill="#9aa7b5" opacity="0.45"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b365d">Upper layer (two-zone idealization)</text>
  <!-- interface -->
  <line x1="62" y1="152" x2="578" y2="152" stroke="#1b365d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="90" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1b365d">Layer interface</text>
  <!-- fire -->
  <polygon points="180,340 200,250 220,340" fill="#c45c26"/>
  <polygon points="188,340 200,270 212,340" fill="#e0a100"/>
  <text x="200" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1b365d">2.5 MW fire</text>
  <!-- exhaust -->
  <rect x="500" y="20" width="36" height="24" fill="#1b365d"/>
  <text x="518" y="16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1b365d">Exhaust</text>
  <!-- roof monitor / downward jet -->
  <rect x="300" y="16" width="40" height="28" fill="#8b1e1e"/>
  <line x1="320" y1="44" x2="320" y2="210" stroke="#8b1e1e" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b1e1e"/>
    </marker>
  </defs>
  <text x="400" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b1e1e">Downward makeup jet</text>
  <!-- dimension -->
  <line x1="40" y1="40" x2="40" y2="360" stroke="#333" stroke-width="1"/>
  <text x="28" y="210" transform="rotate(-90 28 210)" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">14 m</text>
  <text x="320" y="392" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555">Original schematic for FPE-2027-A-002 — not an NCEES figure</text>
</svg>
